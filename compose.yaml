# Development stack. Everything the application needs, plus a Dovecot server to
# mirror from so the sync path can be exercised without a real mail account.
services:
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      LOG_FORMAT: text
      LOG_LEVEL: debug
      DATABASE_URL: postgres://imapped:imapped@postgres:5432/imapped?sslmode=disable
      ENCRYPTION_MASTER_KEY: development-only-key-not-for-production-use
      OBJECT_STORE_PATH: /data/blob
      HTTP_BIND: 0.0.0.0:8080
      IMAP_PLAINTEXT_BIND: 0.0.0.0:1143
      # Cookies travel over plaintext HTTP locally.
      WEB_SECURE_COOKIES: "false"
      BOOTSTRAP_EMAIL: admin@example.com
      BOOTSTRAP_PASSWORD: development-password
    ports:
      - "8080:8080"   # web interface
      - "1143:1143"   # IMAP for mail clients
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "/imapped", "config", "check"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: imapped
      POSTGRES_PASSWORD: imapped
      POSTGRES_DB: imapped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imapped"]
      interval: 5s
      timeout: 5s
      retries: 20

  # An upstream server to mirror from, for development and manual testing.
  dovecot:
    image: dovecot/dovecot:latest
    profiles: ["upstream"]
    ports:
      - "10143:143"

volumes:
  app_data:
  postgres_data:
